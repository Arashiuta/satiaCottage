<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 小屋背景 -->
  <rect x="40" y="80" width="120" height="80" rx="4" fill="#f5e6d3" stroke="#c9a882" stroke-width="2"/>
  <!-- 屋顶 -->
  <polygon points="30,80 100,30 170,80" fill="#e8c4a0" stroke="#c9a882" stroke-width="2"/>
  <!-- 门 -->
  <rect x="80" y="110" width="40" height="50" rx="3" fill="#d4a574" stroke="#b8864e" stroke-width="1.5"/>
  <circle cx="112" cy="135" r="3" fill="#8b6914"/>
  <!-- 窗户左 -->
  <rect x="55" y="100" width="20" height="20" rx="2" fill="#87ceeb" stroke="#b8864e" stroke-width="1.5"/>
  <line x1="65" y1="100" x2="65" y2="120" stroke="#b8864e" stroke-width="1"/>
  <line x1="55" y1="110" x2="75" y2="110" stroke="#b8864e" stroke-width="1"/>
  <!-- 窗户右 -->
  <rect x="125" y="100" width="20" height="20" rx="2" fill="#87ceeb" stroke="#b8864e" stroke-width="1.5"/>
  <line x1="135" y1="100" x2="135" y2="120" stroke="#b8864e" stroke-width="1"/>
  <line x1="125" y1="110" x2="145" y2="110" stroke="#b8864e" stroke-width="1"/>
  <!-- 烟囱 -->
  <rect x="130" y="30" width="15" height="30" fill="#c9a882" stroke="#b8864e" stroke-width="1.5"/>
  <!-- 烟 -->
  <circle cx="137" cy="22" r="5" fill="#ddd" opacity="0.6"/>
  <circle cx="140" cy="14" r="4" fill="#ddd" opacity="0.4"/>
  <circle cx="143" cy="8" r="3" fill="#ddd" opacity="0.2"/>
  <!-- 星星装饰 -->
  <text x="20" y="50" font-size="14" fill="#ffd700">✦</text>
  <text x="175" y="55" font-size="10" fill="#ffd700">✦</text>
  <text x="10" y="70" font-size="8" fill="#ffd700">✧</text>
  <!-- 地面 -->
  <rect x="0" y="160" width="200" height="40" fill="#90c695" rx="0"/>
  <!-- 小花 -->
  <circle cx="30" cy="155" r="4" fill="#ff6b9d"/>
  <circle cx="170" cy="155" r="4" fill="#ffb347"/>
  <circle cx="50" cy="158" r="3" fill="#ff6b9d"/>
  <circle cx="155" cy="158" r="3" fill="#ffb347"/>
  <!-- 文字 -->
  <text x="100" y="190" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#8b6914">砂提娅的小屋</text>
</svg>